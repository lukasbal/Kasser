<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fars kasse-portefølje</title>
<link rel="icon" href="data:,">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body { background: #14110D; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { display: inline-block; animation: spin 0.8s linear infinite; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (root && !root.hasChildNodes()) {
      root.innerHTML =
        '<div style="color:#F3EDE1;background:#14110D;min-height:100vh;padding:24px;font-family:sans-serif;line-height:1.6;">' +
        "Der opstod en fejl ved indlæsning af siden:<br><code style=\"color:#D97A6C\">" +
        (e && e.message ? e.message : e) +
        "</code></div>";
    }
  });
</script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script crossorigin src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script crossorigin src="https://unpkg.com/recharts@2.15.4/umd/Recharts.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useCallback } = React;
const { ResponsiveContainer, AreaChart, Area, XAxis, YAxis, Tooltip, CartesianGrid } = Recharts;

// ---- Hvad far ejer. Ret roligt antal her, hvis han køber/sælger. ----
// "match" er det præcise Steam market_hash_name, som CSFloat's API slår op på.
const HOLDINGS = [
  { id: "recoil", name: "Recoil Case", match: "Recoil Case", qty: 1124 },
  { id: "revolution", name: "Revolution Case", match: "Revolution Case", qty: 536 },
  { id: "dn", name: "Dreams & Nightmares Case", match: "Dreams & Nightmares Case", qty: 292 },
  { id: "fracture", name: "Fracture Case", match: "Fracture Case", qty: 494 },
  { id: "gallery", name: "Gallery Case", match: "Gallery Case", qty: 80 },
  { id: "clutch", name: "Clutch Case", match: "Clutch Case", qty: 620 },
];

// Doppler-fase indgår ikke i Steams market_hash_name, så dette henter den billigste
// aktive Doppler-notering i denne wear — ikke nødvendigvis præcis Phase 3. Ret wear
// her hvis din kniv har en anden (fx "Minimal Wear").
const KNIFE = { id: "knife", name: "M9 Bayonet Doppler", match: "M9 Bayonet | Doppler (Factory New)", qty: 1 };

const HISTORY_KEY = "kasseskabet-history-v1"; // kun værdital, ALDRIG api-nøglen
const SEED_HISTORY = [
  { date: "2025-01-10", value: 9733.2 },
  { date: "2025-02-03", value: 10168.28 },
  { date: "2025-02-20", value: 11942.2 },
  { date: "2025-02-22", value: 13159.48 },
  { date: "2025-03-11", value: 11419.88 },
  { date: "2025-04-06", value: 9598.2 },
  { date: "2025-05-08", value: 11006.2 },
  { date: "2025-06-24", value: 11957.06 },
  { date: "2025-07-28", value: 13057.42 },
  { date: "2025-09-26", value: 13621.7 },
  { date: "2025-10-24", value: 11507.54 },
  { date: "2025-10-25", value: 13464.4 },
  { date: "2026-01-27", value: 9769.42 },
  { date: "2026-05-09", value: 12329.32 },
];

const dkk = (n) => n.toLocaleString("da-DK", { maximumFractionDigits: 0 }) + " kr.";
const dkk2 = (n) =>
  n.toLocaleString("da-DK", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " kr.";
const fmtDate = (iso) =>
  new Date(iso).toLocaleDateString("da-DK", { day: "2-digit", month: "short", year: "2-digit" });
const fmtTime = (iso) =>
  new Date(iso).toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" });
const todayISO = () => new Date().toISOString().slice(0, 10);

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : SEED_HISTORY;
  } catch {
    return SEED_HISTORY;
  }
}
function saveHistory(h) {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
  } catch {
    // ignore — grafen virker stadig for denne session
  }
}

async function fetchLowestPrice(marketHashName, apiKey) {
  const url =
    "https://csfloat.com/api/v1/listings?sort_by=lowest_price&limit=1&market_hash_name=" +
    encodeURIComponent(marketHashName);
  const res = await fetch(url, { headers: { Authorization: apiKey } });
  if (!res.ok) {
    throw new Error(
      res.status === 401 || res.status === 403
        ? "Nøglen blev afvist af CSFloat."
        : `CSFloat svarede med fejl ${res.status}.`
    );
  }
  const list = await res.json();
  if (!Array.isArray(list) || list.length === 0 || typeof list[0].price !== "number") {
    return null;
  }
  return list[0].price / 100; // cents -> USD
}

function KeyGate({ onSubmit, error, loading }) {
  const [key, setKey] = useState("");
  return (
    <div style={styles.page}>
      <div style={{ ...styles.wrap, paddingTop: 60 }}>
        <div style={styles.eyebrow}>LUXYI'S MONEY MACHINE</div>
        <h1 style={styles.h1}>Fars kasse-portefølje</h1>
        <div style={styles.gateCard}>
          <div style={styles.settingsLabel}>CSFloat API-nøgle</div>
          <div style={styles.settingsHint}>
            Din nøgle bruges kun til at hente priser lige nu og gemmes ingen steder — hverken i
            browseren eller på siden. Du skal indtaste den igen, hver gang du åbner siden.
            Opret/find din nøgle under "Developer" på{" "}
            <a href="https://csfloat.com/profile" target="_blank" rel="noreferrer" style={{ color: "#C6A15B" }}>
              csfloat.com/profile
            </a>
            .
          </div>
          <input
            className="key-input"
            style={inputStyle}
            type="password"
            autoComplete="off"
            placeholder="Indsæt API-nøgle"
            value={key}
            onChange={(e) => setKey(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && key && onSubmit(key)}
          />
          {error && <div style={{ color: "#D97A6C", fontSize: 12.5, marginTop: 10 }}>{error}</div>}
          <button
            style={btnPrimaryStyle}
            disabled={!key || loading}
            onClick={() => onSubmit(key)}
          >
            {loading ? "Henter priser…" : "Vis priser"}
          </button>
        </div>
      </div>
    </div>
  );
}

function Portfolio({ cases, knifePrice, history, lastFetched, onRefresh, refreshing, refreshError }) {
  const totalCasesValue = useMemo(() => cases.reduce((s, c) => s + c.qty * (c.price || 0), 0), [cases]);
  const knifeValue = (knifePrice || 0) * KNIFE.qty;
  const totalValue = totalCasesValue + knifeValue;
  const chartData = history.map((h) => ({ ...h, label: fmtDate(h.date) }));

  return (
    <div style={styles.page}>
      <div style={styles.wrap}>
        <div style={styles.eyebrow}>LUXYI'S MONEY MACHINE</div>
        <h1 style={styles.h1}>Fars kasse-portefølje</h1>

        <div style={styles.heroCard}>
          <div style={styles.heroLabel}>Samlet værdi lige nu</div>
          <div style={styles.heroValue}>{dkk(totalValue)}</div>
        </div>

        <div style={styles.statusRow}>
          <div style={{ flex: 1 }}>
            {refreshing ? (
              <span><span className="spin">⟳</span> Henter priser…</span>
            ) : (
              <span>Priser hentet fra CSFloat kl. {fmtTime(lastFetched)}</span>
            )}
            {refreshError && <div style={{ color: "#D97A6C", marginTop: 4 }}>{refreshError}</div>}
          </div>
          <button style={btnGhostStyle} onClick={onRefresh} disabled={refreshing}>
            Hent igen
          </button>
        </div>

        <div style={styles.sectionLabel}>Udvikling i porteføljens værdi</div>
        <div style={styles.chartCard}>
          <ResponsiveContainer width="100%" height={200}>
            <AreaChart data={chartData} margin={{ top: 8, right: 10, left: -18, bottom: 0 }}>
              <defs>
                <linearGradient id="brassFill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#C6A15B" stopOpacity={0.35} />
                  <stop offset="100%" stopColor="#C6A15B" stopOpacity={0} />
                </linearGradient>
              </defs>
              <CartesianGrid stroke="#2A2317" strokeDasharray="3 3" vertical={false} />
              <XAxis dataKey="label" tick={{ fill: "#8A7F6E", fontSize: 10, fontFamily: "Inter" }} axisLine={{ stroke: "#3A3122" }} tickLine={false} interval="preserveStartEnd" />
              <YAxis tick={{ fill: "#8A7F6E", fontSize: 10, fontFamily: "Inter" }} axisLine={false} tickLine={false} width={46} tickFormatter={(v) => (v / 1000).toFixed(0) + "k"} />
              <Tooltip contentStyle={{ background: "#1E1912", border: "1px solid #3A3122", borderRadius: 8, fontFamily: "Inter", fontSize: 12 }} labelStyle={{ color: "#B8AC97" }} formatter={(v) => [dkk2(v), "Værdi"]} />
              <Area type="monotone" dataKey="value" stroke="#C6A15B" strokeWidth={2} fill="url(#brassFill)" />
            </AreaChart>
          </ResponsiveContainer>
        </div>

        <div style={styles.sectionLabel}>Kasser</div>
        <div style={styles.caseList}>
          {cases.map((c) => (
            <div key={c.id} style={styles.caseRow}>
              <div style={styles.caseInfo}>
                <div style={styles.caseName}>{c.name}</div>
                <div style={styles.caseQty}>{c.qty} stk</div>
              </div>
              <div style={styles.caseValues}>
                <div style={styles.casePrice}>{c.price != null ? dkk2(c.price) + " / stk" : "—"}</div>
                <div style={styles.caseValue}>{c.price != null ? dkk(c.qty * c.price) : "—"}</div>
              </div>
            </div>
          ))}
        </div>

        <div style={styles.sectionLabel}>Kniv</div>
        <div style={styles.caseList}>
          <div style={styles.caseRow}>
            <div style={styles.caseInfo}>
              <div style={styles.caseName}>{KNIFE.name}</div>
            </div>
            <div style={styles.caseValues}>
              <div style={styles.caseValue}>{knifePrice != null ? dkk(knifeValue) : "—"}</div>
            </div>
          </div>
        </div>

        <div style={styles.footNote}>
          Priserne er de billigste aktive noteringer på CSFloat lige nu. Din API-nøgle blev ikke
          gemt noget sted — luk eller genindlæs siden, og den er væk.
        </div>
      </div>
    </div>
  );
}

function App() {
  const [apiKey, setApiKey] = useState(null); // kun i hukommelsen, aldrig persisteret
  const [cases, setCases] = useState(HOLDINGS.map((c) => ({ ...c, price: null })));
  const [knifePrice, setKnifePrice] = useState(null);
  const [history, setHistory] = useState(loadHistory());
  const [lastFetched, setLastFetched] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const runFetch = useCallback(async (key) => {
    setLoading(true);
    setError("");
    try {
      const items = [...HOLDINGS, KNIFE];
      const results = await Promise.all(items.map((it) => fetchLowestPrice(it.match, key)));
      const newCases = HOLDINGS.map((c, i) => ({ ...c, price: results[i] }));
      const newKnifePrice = results[HOLDINGS.length];

      if (results.every((r) => r == null)) {
        throw new Error("Kunne ikke hente nogen priser — tjek nøglen, eller prøv igen senere.");
      }

      const totalCasesValue = newCases.reduce((s, c) => s + c.qty * (c.price || 0), 0);
      const totalValue = totalCasesValue + (newKnifePrice || 0) * KNIFE.qty;
      const today = todayISO();
      const last = history[history.length - 1];
      const newHistory =
        last && last.date === today
          ? [...history.slice(0, -1), { date: today, value: totalValue }]
          : [...history, { date: today, value: totalValue }];

      setCases(newCases);
      setKnifePrice(newKnifePrice);
      setHistory(newHistory);
      saveHistory(newHistory);
      setLastFetched(new Date().toISOString());
      setApiKey(key);
    } catch (e) {
      setError(e && e.message ? e.message : "Kunne ikke hente priser (netværk eller CORS-fejl).");
    } finally {
      setLoading(false);
    }
  }, [history]);

  if (!apiKey) {
    return <KeyGate onSubmit={runFetch} error={error} loading={loading} />;
  }

  return (
    <Portfolio
      cases={cases}
      knifePrice={knifePrice}
      history={history}
      lastFetched={lastFetched}
      onRefresh={() => runFetch(apiKey)}
      refreshing={loading}
      refreshError={error}
    />
  );
}

const inputStyle = {
  width: "100%",
  background: "#22190F",
  border: "1px solid #4A3A22",
  color: "#F3EDE1",
  fontFamily: "'JetBrains Mono', monospace",
  fontSize: 15,
  padding: "10px 12px",
  borderRadius: 6,
  outline: "none",
  marginTop: 12,
};
const btnPrimaryStyle = {
  background: "#C6A15B",
  color: "#14110D",
  border: "none",
  fontFamily: "'Inter', sans-serif",
  fontWeight: 600,
  fontSize: 14,
  padding: "12px 18px",
  borderRadius: 8,
  cursor: "pointer",
  marginTop: 14,
  width: "100%",
};
const btnGhostStyle = {
  background: "transparent",
  color: "#B8AC97",
  border: "1px solid #3A3122",
  fontFamily: "'Inter', sans-serif",
  fontWeight: 500,
  fontSize: 13,
  padding: "10px 14px",
  borderRadius: 8,
  cursor: "pointer",
};

const styles = {
  page: { minHeight: "100%", background: "#14110D", color: "#F3EDE1", fontFamily: "'Inter', sans-serif" },
  wrap: { maxWidth: 520, margin: "0 auto", padding: "20px 16px 40px" },
  eyebrow: { fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.12em", color: "#8A7F6E" },
  h1: { fontFamily: "'Fraunces', serif", fontWeight: 600, fontSize: 26, margin: "4px 0 16px 0", color: "#F3EDE1" },
  gateCard: { background: "#1A150F", border: "1px solid #3A3122", borderRadius: 14, padding: "20px" },
  settingsLabel: { fontSize: 14, fontWeight: 600, color: "#F3EDE1" },
  settingsHint: { fontSize: 12.5, color: "#8A7F6E", marginTop: 6, lineHeight: 1.6 },
  heroCard: { background: "linear-gradient(180deg, #1E1912 0%, #1A150F 100%)", border: "1px solid #3A3122", borderRadius: 14, padding: "22px 20px", marginBottom: 14 },
  heroLabel: { fontSize: 13, color: "#B8AC97", marginBottom: 6 },
  heroValue: { fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 40, lineHeight: 1.1, color: "#F3EDE1" },
  statusRow: { display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10, fontSize: 12.5, color: "#B8AC97", marginBottom: 8 },
  sectionLabel: { fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "#8A7F6E", margin: "18px 0 10px 0" },
  chartCard: { background: "#1A150F", border: "1px solid #2A2317", borderRadius: 14, padding: "12px 8px 4px" },
  caseList: { display: "flex", flexDirection: "column", gap: 8 },
  caseRow: { display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, background: "#1A150F", border: "1px solid #2A2317", borderRadius: 10, padding: "12px 14px" },
  caseInfo: { minWidth: 0 },
  caseName: { fontSize: 14.5, fontWeight: 500, color: "#F3EDE1" },
  caseQty: { fontSize: 12, color: "#8A7F6E", marginTop: 2 },
  caseValues: { textAlign: "right" },
  casePrice: { fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: "#B8AC97" },
  caseValue: { fontFamily: "'JetBrains Mono', monospace", fontSize: 15, fontWeight: 600, color: "#F3EDE1", marginTop: 2 },
  footNote: { fontSize: 12, color: "#6B6152", marginTop: 26, lineHeight: 1.5 },
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
